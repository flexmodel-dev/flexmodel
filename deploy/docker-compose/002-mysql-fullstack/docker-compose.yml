services:
  mysql:
    container_name: ${CONTAINER_NAME_PREFIX}-flexmodel-mysql
    image: mysql:8.0
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/my.cnf:/etc/my.cnf
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=GMT+08
    command: >
      bash -c "
      chmod 644 /etc/my.cnf
      && /entrypoint.sh mysqld
      "
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
    networks:
      - flexmodel
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
  rabbitmq:
    container_name: ${CONTAINER_NAME_PREFIX}-flexmodel-rabbitmq
    image: rabbitmq:3.13-management
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - TZ=GMT+08
    ports:
      - ${RABBITMQ_AMQP_PORT:-5672}:5672
      - ${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    networks:
      - flexmodel
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      timeout: 20s
      retries: 10
  rustfs:
    container_name: ${CONTAINER_NAME_PREFIX}-flexmodel-rustfs
    image: rustfs/rustfs:latest
    restart: always
    volumes:
      - ./rustfs/data:/data
    environment:
      - TZ=GMT+08
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_OBS_LOGGER_LEVEL=info
      # single-disk single-node mode; bypass strict disk topology check
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
    ports:
      - ${RUSTFS_S3_API_PORT:-9000}:9000
      - ${RUSTFS_CONSOLE_PORT:-9001}:9001
    networks:
      - flexmodel
    healthcheck:
      test: [ "CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  flexmodel-ui:
    container_name: ${CONTAINER_NAME_PREFIX}-flexmodel-ui
    image: cjbi/flexmodel-ui:latest
    restart: always
    environment:
      - TZ=GMT+08
    depends_on:
      flexmodel-server:
        condition: service_started
    networks:
      - flexmodel
  nginx:
    container_name: ${CONTAINER_NAME_PREFIX}-flexmodel-nginx
    image: nginx:1.25.3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/default.conf.template:/etc/nginx/conf.d/default.conf.template
      - ./flexmodel/pages:/data/pages
    restart: always
    ports:
      - ${NGINX_HTTP_PORT:-80}:80
      - ${NGINX_HTTPS_PORT:-443}:443
    environment:
      - TZ=GMT+08
      - FLEXMODEL_PROJECT_BASE_DOMAIN=${FLEXMODEL_PROJECT_BASE_DOMAIN:-localhost}
    command: >
      /bin/sh -c "export FLEXMODEL_PROJECT_BASE_DOMAIN_ESCAPED=$$(echo $$FLEXMODEL_PROJECT_BASE_DOMAIN | sed 's/\\./\\\\./g') && envsubst '$$FLEXMODEL_PROJECT_BASE_DOMAIN $$FLEXMODEL_PROJECT_BASE_DOMAIN_ESCAPED' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      flexmodel-server:
        condition: service_started
    networks:
      - flexmodel
  flexmodel-server:
    container_name: ${CONTAINER_NAME_PREFIX}-flexmodel-server
    image: ${FLEXMODEL_SERVER_IMAGE:-cjbi/flexmodel-server-native:latest}
    restart: always
    volumes:
      - ./flexmodel/storage:/deployments/storage
      - ./flexmodel/database:/deployments/database
      - ./flexmodel/logs:/deployments/logs
      - ./flexmodel/pages:/deployments/pages
    env_file: .env
    environment:
      - TZ=GMT+08
      - FLEXMODEL_DATASOURCE_DB_KIND=mysql
      # readTimeout: MySQL 容器重启后池中残留连接会读到已死对端，无超时会无限阻塞（曾导致事件循环冻结）
      - FLEXMODEL_DATASOURCE_USERNAME=root
      - FLEXMODEL_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - FLEXMODEL_PROJECT_URL_TEMPLATE=jdbc:mysql://mysql:3306/{{databaseName}}?connectTimeout=5000&readTimeout=15000
      - QUARKUS_REST_CLIENT_FUNCTION_RUNTIME_URL=http://flexmodel-functions-runtime:9999
      - QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE=100M
      - FLEXMODEL_PAGES_ROOT=/data/pages
      - FLEXMODEL_PAGES_URL_TEMPLATE=${FLEXMODEL_PAGES_URL_TEMPLATE:-https://{{projectId}}.example.com}
      - FLEXMODEL_EDGE_URL_TEMPLATE=${FLEXMODEL_EDGE_URL_TEMPLATE:-https://{{projectId}}.example.com/functions/{{name}}}
      # RabbitMQ
      - QUARKUS_RABBITMQ_HOST=rabbitmq
      - QUARKUS_RABBITMQ_PORT=5672
      - QUARKUS_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - QUARKUS_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - QUARKUS_RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VIRTUAL_HOST:-/}
      - FLEXMODEL_RABBITMQ_ENABLED=${FLEXMODEL_RABBITMQ_ENABLED:-true}

      # RustFS (S3-compatible object storage)
      - FLEXMODEL_STORAGE_TYPE=s3
      - FLEXMODEL_STORAGE_S3_BUCKET=${RUSTFS_BUCKET}
      - FLEXMODEL_STORAGE_S3_ENDPOINT=http://rustfs:9000
      - FLEXMODEL_STORAGE_S3_REGION=us-east-1
      - FLEXMODEL_STORAGE_S3_PATH_STYLE=true
      - QUARKUS_S3_AWS_REGION=us-east-1
      - QUARKUS_S3_AWS_CREDENTIALS_TYPE=static
      - QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - QUARKUS_S3_ENDPOINT_OVERRIDE=http://rustfs:9000
      - QUARKUS_S3_PATH_STYLE_ACCESS=true

    networks:
      - flexmodel
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  flexmodel-functions-runtime:
    container_name: ${CONTAINER_NAME_PREFIX}-flexmodel-functions-runtime
    image: cjbi/flexmodel-functions-runtime:latest
    restart: always
    env_file: .env
    environment:
      - FLEXMODEL_JAVA_HOST=flexmodel-server
      - FLEXMODEL_JAVA_PORT=8080
      - FLEXMODEL_PORT=9999
      - FLEXMODEL_HOST=0.0.0.0
    networks:
      - flexmodel
    depends_on:
      - flexmodel-server
networks:
  flexmodel:
    name: ${CONTAINER_NAME_PREFIX}_flexmodel_default
    driver: bridge
