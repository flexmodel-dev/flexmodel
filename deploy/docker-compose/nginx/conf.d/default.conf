# ============================================================
# Main domain → Java API + UI
# ============================================================
server {
    listen       80;
    server_name  localhost;

    client_max_body_size 1024m;

    # API reverse proxy
    location /api/ {
        proxy_pass http://flexmodel-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        add_header Cache-Control no-cache;
    }

    # Pages path-based routing (dev / path mode)
    # /pages/{projectId}/         → production alias
    # /pages/{projectId}/{alias}/ → preview / short alias
    location ~ ^/pages/(?<projectId>[^/]+)(/(?<alias>[^/]+))?/(?<subpath>.*)$ {
        root /data/pages;

        # Build the internal path: $projectId/$alias/$subpath
        set $pages_root /data/pages/$projectId;
        set $pages_alias $alias;
        set $pages_subpath $subpath;

        # Default: production alias if no alias specified
        set $pages_path $projectId/production/$subpath;
        if ($alias) {
            set $pages_path $projectId/$alias/$subpath;
        }

        try_files /$pages_path /$projectId/production/$subpath /$pages_path/index.html /$projectId/production/index.html =404;

        types {
            application/javascript js mjs;
            text/css css;
            text/html html;
            application/json json;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/x-icon ico;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            application/manifest+json webmanifest;
        }
    }

    location ~ ^/pages/(?<projectId>[^/]+)/?$ {
        root /data/pages;
        try_files /$projectId/production/index.html =404;
    }

    # UI reverse proxy
    location / {
        proxy_pass http://flexmodel-ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# ============================================================
# Wildcard subdomain → Deno Runtime (Edge Functions)
# {projectId}.domain/functions/{name} → Deno /functions/{projectId}/{name}
# ============================================================
server {
    listen       80;
    server_name  *.localhost;

    client_max_body_size 1024m;

    # Edge function invocation → Deno Runtime (no path rewrite needed)
    location /functions/ {
        proxy_pass http://flexmodel-functions-runtime:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# ============================================================
# Pages — Root subdomain → production (shortest URL)
# {projectId}.pages.local → nginx-direct file serving
# ============================================================
server {
    listen       80;
    server_name  ~^(?<projectId>[^.]+)\.pages\.local$;

    root /data/pages/$projectId/production;

    location / {
        try_files $uri $uri/ /index.html =404;
        types {
            application/javascript js mjs;
            text/css css;
            text/html html;
            application/json json;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/x-icon ico;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            application/manifest+json webmanifest;
        }
    }

    # Static assets — long cache (hash filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico|mjs)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}

# ============================================================
# Pages — Nested subdomain → preview / short alias
# preview.{projectId}.pages.local / k7x8.{projectId}.pages.local
# ============================================================
server {
    listen       80;
    server_name  ~^(?<alias>[^.]+)\.(?<projectId>[^.]+)\.pages\.local$;

    root /data/pages/$projectId/$alias;

    location / {
        try_files $uri $uri/ /index.html =404;
        types {
            application/javascript js mjs;
            text/css css;
            text/html html;
            application/json json;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/x-icon ico;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            application/manifest+json webmanifest;
        }
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico|mjs)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
